<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOLF Agent Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4444;
            box-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
            transition: background 0.3s;
        }

        .status-indicator.connected {
            background: #44ff44;
            box-shadow: 0 0 10px rgba(68, 255, 68, 0.5);
        }

        .config-panel {
            background: #f5f5f5;
            padding: 20px;
            border-bottom: 1px solid #ddd;
        }

        .config-panel.hidden {
            display: none;
        }

        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .config-item {
            display: flex;
            flex-direction: column;
        }

        .config-item label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            margin-bottom: 5px;
        }

        .config-item input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .config-item input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .message.system {
            background: #e3f2fd;
            color: #1976d2;
            font-style: italic;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
            max-width: 90%;
        }

        .message.user {
            background: #667eea;
            color: white;
            margin-left: auto;
        }

        .message.agent {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
        }

        .message.error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #c62828;
        }

        .message-header {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 12px;
            opacity: 0.8;
        }

        .message-content {
            line-height: 1.5;
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 14px;
        }

        .input-area input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-area button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .input-area button:hover {
            background: #5568d3;
        }

        .input-area button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .toggle-config {
            background: transparent;
            color: white;
            border: 1px solid white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .toggle-config:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .typing-indicator {
            display: none;
            padding: 10px;
            color: #666;
            font-style: italic;
            font-size: 14px;
        }

        .typing-indicator.active {
            display: block;
        }

        .stream-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-size: 14px;
        }

        .stream-toggle input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐺 WOLF Agent Interface</h1>
            <div class="controls">
                <div class="stream-toggle">
                    <input type="checkbox" id="streamMode">
                    <label for="streamMode">Stream Mode</label>
                </div>
                <button class="toggle-config" onclick="toggleConfig()">⚙️ Configure</button>
                <div class="status">
                    <span class="status-indicator" id="statusIndicator"></span>
                    <span id="statusText">Disconnected</span>
                </div>
            </div>
        </div>

        <div class="config-panel" id="configPanel">
            <div class="config-grid">
                <div class="config-item">
                    <label>Model</label>
                    <input type="text" id="model" value="llama3.2:3b" placeholder="e.g., gpt-4">
                </div>
                <div class="config-item">
                    <label>Host Address</label>
                    <input type="text" id="hostAddress" value="http://localhost" placeholder="http://localhost">
                </div>
                <div class="config-item">
                    <label>Host Port</label>
                    <input type="number" id="hostPort" value="11434" placeholder="11434">
                </div>
                <div class="config-item">
                    <label>API Key (Optional)</label>
                    <input type="password" id="apiKey" placeholder="Leave empty if not needed">
                </div>
            </div>
            <div class="config-item" style="margin-bottom: 15px;">
                <label>System Prompt</label>
                <input type="text" id="sysPrompt" value="You are a helpful WOLF assistant." placeholder="System prompt">
            </div>
            <button class="btn btn-primary" onclick="configureAgent()">Apply Configuration</button>
        </div>

        <div class="chat-container">
            <div class="messages" id="messages"></div>
            <div class="typing-indicator" id="typingIndicator">Agent is typing...</div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Type your message..." disabled>
                <button id="sendButton" onclick="sendMessage()" disabled>Send</button>
                <button class="btn btn-secondary" onclick="resetContext()" disabled id="resetButton">Reset</button>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let sessionId = null;
        let agentConfigured = false;

        function generateSessionId() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        function connectWebSocket() {
            sessionId = generateSessionId();
            const wsUrl = `ws://${window.location.host}/ws/${sessionId}?client_type=gui`;
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                updateStatus(true);
                addMessage('system', 'Connected to WOLF Gateway');
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleMessage(data);
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                addMessage('error', 'Connection error occurred');
            };
            
            ws.onclose = () => {
                updateStatus(false);
                agentConfigured = false;
                addMessage('system', 'Disconnected from gateway');
                setTimeout(connectWebSocket, 3000);
            };
        }

        function handleMessage(data) {
            const { type, content, agent_name } = data;
            
            switch(type) {
                case 'system':
                    addMessage('system', content);
                    break;
                case 'user_echo':
                    addMessage('user', content);
                    break;
                case 'agent_response':
                    addMessage('agent', content, agent_name);
                    break;
                case 'agent_configured':
                    agentConfigured = true;
                    enableInputs();
                    addMessage('system', content);
                    break;
                case 'stream_start':
                    showTyping(true);
                    break;
                case 'stream_complete':
                    showTyping(false);
                    addMessage('agent', content, agent_name);
                    break;
                case 'error':
                    addMessage('error', content);
                    break;
            }
        }

        function addMessage(type, content, sender = null) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            if (sender && type === 'agent') {
                const header = document.createElement('div');
                header.className = 'message-header';
                header.textContent = sender;
                messageDiv.appendChild(header);
            }
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;
            messageDiv.appendChild(contentDiv);
            
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function updateStatus(connected) {
            const indicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');
            
            if (connected) {
                indicator.classList.add('connected');
                statusText.textContent = 'Connected';
            } else {
                indicator.classList.remove('connected');
                statusText.textContent = 'Disconnected';
            }
        }

        function showTyping(show) {
            const indicator = document.getElementById('typingIndicator');
            if (show) {
                indicator.classList.add('active');
            } else {
                indicator.classList.remove('active');
            }
        }

        function toggleConfig() {
            const panel = document.getElementById('configPanel');
            panel.classList.toggle('hidden');
        }

        function configureAgent() {
            const config = {
                model: document.getElementById('model').value,
                host_address: document.getElementById('hostAddress').value,
                host_port: parseInt(document.getElementById('hostPort').value),
                sys_prompt: document.getElementById('sysPrompt').value,
                verbose: 1
            };
            
            const apiKey = document.getElementById('apiKey').value;
            if (apiKey) {
                config.api_key = apiKey;
            }
            
            const message = {
                type: 'configure_agent',
                config: config,
                timestamp: new Date().toISOString(),
                session_id: sessionId
            };
            
            ws.send(JSON.stringify(message));
            toggleConfig();
        }

        function enableInputs() {
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendButton').disabled = false;
            document.getElementById('resetButton').disabled = false;
        }

        function sendMessage() {
            if (!agentConfigured) {
                alert('Please configure the agent first');
                return;
            }
            
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            
            if (!content) return;
            
            const streamMode = document.getElementById('streamMode').checked;
            
            const message = {
                type: streamMode ? 'stream' : 'chat',
                content: content,
                timestamp: new Date().toISOString(),
                session_id: sessionId
            };
            
            ws.send(JSON.stringify(message));
            input.value = '';
        }

        function resetContext() {
            if (!agentConfigured) return;
            
            const message = {
                type: 'reset',
                content: '',
                timestamp: new Date().toISOString(),
                session_id: sessionId
            };
            
            ws.send(JSON.stringify(message));
        }

        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        window.onload = () => {
            connectWebSocket();
        };
    </script>
</body>
</html>
